name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android signing key
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        run: godot --headless --path . --export-debug "Android" build/LastIsland3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastIsland3D-debug-apk
          path: build/LastIsland3D.apk
          if-no-files-found: error

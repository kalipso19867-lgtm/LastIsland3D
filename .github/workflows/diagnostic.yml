name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Download Godot
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable" build
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

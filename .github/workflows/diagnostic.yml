name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare writable workspace and clean Godot config
        run: |
          chmod -R a+rwX .
          mkdir -p "$RUNNER_TEMP/godot-config" "$RUNNER_TEMP/godot-home"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/godot-config" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP/godot-home" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Download Godot
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable" build
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Prepare Android signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export APK
        run: |
          rm -rf "$XDG_CONFIG_HOME/godot"
          mkdir -p "$XDG_CONFIG_HOME"
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/LastIsland3D.apk
      - name: Verify APK
        run: |
          test -s build/LastIsland3D.apk
          unzip -t build/LastIsland3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LastIsland3D-Android-APK
          path: build/LastIsland3D.apk
          if-no-files-found: error
          retention-days: 14
